name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
env:
  REPO: HyosungTools/splogparser

jobs:
  build:
    # https://github.com/actions/runner-images/blob/main/images/win/Windows2022-Readme.md
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        
    - name: Fetch all tags
      run: git fetch --prune origin +refs/tags/*:refs/tags/*
    
    # GitVersion - respects existing tags
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.5.0
      with:
        versionSpec: '6.x'

    - name: Determine Version
      id: versioning
      uses: gittools/actions/gitversion/execute@v4.5.0
      with:
        useConfigFile: true

    - name: Display Version
      run: echo "Version - ${{ steps.versioning.outputs.semVer }}"

    - name: Update VersionInfo
      run: |
        $version = "${{ steps.versioning.outputs.semVer }}"
        $content = "// Auto-generated version file`nnamespace SplogParser`n{`n    public static class VersionInfo`n    {`n        public const string Current = `"$version`";`n    }`n}"
        Set-Content -Path src\splogparser\VersionInfo.cs -Value $content
      shell: pwsh      

    # Install MSBuild tools and add to Path
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
      with:
        vs-version: '17.4'
    
    # List the packages restored
    - name: List dependencies restored
      run: cd src && nuget restore && cd .. 
                  
    # Make dist directory
    - name: Make Dir
      run: mkdir dist
            
    # Build splogparser (.NET Framework 4.7.2)
    - name: Build
      run: msbuild src\\splogparser.sln /m:1 /t:Clean,Build /p:Configuration="Release" /p:Platform="Any CPU" /nodeReuse:false

    # Setup VSTest
    - name: Setup VSTest Path
      uses: darenm/Setup-VSTest@v1.2

    # Coverage collector - instruments the .NET Framework test host that vstest launches
    - name: Install dotnet-coverage
      run: dotnet tool install --global dotnet-coverage

    # Test, under coverage. dotnet-coverage wraps the existing RunUnitTests target (msbuild -> vstest
    # -> testhost) and writes a single Cobertura report for all *Tests.dll projects.
    - name: Test (with coverage)
      shell: bash
      run: dotnet-coverage collect 'msbuild src/splogparser.sln /t:RunUnitTests /p:Configuration=Release /p:Platform="Any CPU"' -f cobertura -o coverage.cobertura.xml

    # Turn the Cobertura file into an HTML report + a Markdown summary (no external service, no badge)
    - name: Generate coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@5
      with:
        reports: coverage.cobertura.xml
        targetdir: coverage-report
        reporttypes: Html;MarkdownSummaryGithub

    # Show the coverage summary right in the Actions run (Summary panel)
    - name: Coverage summary
      shell: bash
      run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    # Keep the full HTML report (per-file / per-parser coverage) as a downloadable artifact
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report


    # List artifacts
    - name: List artifacts
      run: cd dist && dir && cd ..
      
    # Install Inno Setup
    - name: Install Inno Setup
      run: choco install innosetup --yes

    # Build installer
    - name: Build Installer
      run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.versioning.outputs.semVer }} installer\splogparser.iss'
      
    # Zip artifacts
    - uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        filename: 'release.zip'
        path: .\\dist\\

    # Create Release
    - name: Create Release
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: ncipollo/release-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.github_token }}
      with:
        artifacts: release.zip,installer\output\splogparser-setup-${{ steps.versioning.outputs.semVer }}.exe
        generateReleaseNotes: true
        tag: v${{ steps.versioning.outputs.semVer }}
        name: v${{ steps.versioning.outputs.semVer }}
        allowUpdates: true
        prerelease: true      
