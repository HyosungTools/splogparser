
name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 8.0.21)'
        required: true

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Fail fast on a bad version, a duplicate tag, or running from the wrong branch
      - name: Validate Inputs
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            Write-Error "Releases must be run from main (got ${{ github.ref }})"; exit 1
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Version must be MAJOR.MINOR.PATCH with no leading 'v' (got '$version')"; exit 1
          }
          if (git tag --list "v$version") {
            Write-Error "Tag v$version already exists"; exit 1
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '17.4'

      - name: Restore Dependencies
        run: cd src && nuget restore && cd ..

      - name: Update VersionInfo
        run: |
          $version = "${{ github.event.inputs.version }}"
          $content = "// Auto-generated version file`nnamespace SplogParser`n{`n    public static class VersionInfo`n    {`n        public const string Current = `"$version`";`n    }`n}"
          Set-Content -Path src\splogparser\VersionInfo.cs -Value $content
        shell: pwsh        
        
      - name: Make Dir
        run: mkdir dist

      - name: Build splogparser
        run: msbuild src\\splogparser.sln /m:1 /t:Clean,Build /p:Configuration="Release" /p:Platform="Any CPU" /nodeReuse:false


      # Run the unit tests before anything is tagged or published
      - name: Setup VSTest Path
        uses: darenm/Setup-VSTest@v1.2

      - name: Test
        run: msbuild src\\splogparser.sln /t:RunUnitTests /p:Configuration="Release" /p:Platform="Any CPU"

      # Install Inno Setup
      - name: Install Inno Setup
        run: choco install innosetup --yes

      # Build installer
      - name: Build Installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ github.event.inputs.version }} installer\splogparser.iss'

      - name: Package Build Output
        run: Compress-Archive -Path dist\\* -Destination splogparser-${{ github.event.inputs.version }}.zip
        shell: pwsh
        
      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag v${{ github.event.inputs.version }}
          git push origin v${{ github.event.inputs.version }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          $tag = "v$version"

          # Previous full release: newest v* tag that isn't a prerelease and isn't the one we just pushed
          $prev = git tag --list "v*" --sort=-v:refname |
                  Where-Object { $_ -match '^v\d+\.\d+\.\d+$' -and $_ -ne $tag } |
                  Select-Object -First 1

          $notesArgs = @("--generate-notes")
          if ($prev) { $notesArgs += @("--notes-start-tag", $prev) }

          gh release create $tag `
            "splogparser-$version.zip" `
            "installer/output/splogparser-setup-$version.exe" `
            --title "splogparser $tag" `
            --latest `
            @notesArgs
